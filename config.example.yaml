# douyin2weibo 配置文件模板（Mac / Windows 通用）
# 首次使用请复制为 config.yaml，并按本机路径修改

# 抖音 / 微博登录态 cookie（建议放在本项目的 cookies/ 目录下）
douyin_cookie_path: "cookies/douyin_douyin-creator.json"
weibo_cookie_path: "cookies/weibo_weibo-creator.json"

# ffmpeg / ffprobe 路径（Windows 若已加入系统 PATH 或放在 bin/ 目录可留空自动查找）
ffmpeg_path: ""
ffprobe_path: ""

# 输出目录与本地台账（默认放到桌面，按固定日期目录 YYYY-MM-DD 归档，不动态改名）
output_dir: "~/Desktop/微博待发视频"
ledger_path: "ledger.json"

# GitHub 更新镜像（直连 GitHub 超时时自动按顺序尝试下列国内镜像，不改原仓库配置）
github_mirrors:
  - "https://gh-proxy.com/"
  - "https://ghfast.top/"
  - "https://ghproxy.net/"

# 微博文案清洗（点击「复制简介」时自动去掉仅限抖音的尾标话题，纯本地规则 0 费用）
weibo_clean:
  strip_tag_keywords:
    - "抖音精选"
    - "上抖音"
    - "来抖音"
    - "抖音小助手"
    - "青年创作者成长计划"
    - "氪金兽"
  # 体育账号识别关键词（匹配微博号、抖音作者或原视频话题；命中后把全部标签替换为下方 sports_replace_tags）
  sports_account_keywords:
    - "体坛"
    - "体育"
    - "足球"
    - "篮球"
    - "乒乓"
    - "羽毛球"
    - "网球"
    - "排球"
    - "台球"
    - "斯诺克"
    - "懂个球"
    - "绿茵"
    - "国足"
    - "NBA"
    - "CBA"
    - "欧冠"
    - "英超"
    - "西甲"
    - "德甲"
    - "意甲"
    - "法甲"
    - "中超"
    - "奥运"
    - "亚运"
    - "世锦赛"
    - "田径"
    - "游泳"
    - "跳水"
    - "体操"
    - "冰雪"
    - "冬奥"
    - "短道"
    - "花滑"
    - "拳击"
    - "格斗"
    - "UFC"
    - "F1"
    - "赛车"
    - "马拉松"
    - "高尔夫"
    - "棒球"
    - "橄榄球"
    - "冰球"
  sports_replace_tags: "#微博视频号迎新计划##一分钟精选视频扶持计划##V观体坛#"

# 当输入为抖音主页链接时，默认抓取最新几条非置顶作品
latest_per_profile: 1

# 视频与封面转码参数
transcode:
  crf: 18
  preset: "medium"
  copy_if_1080p: true
  audio_bitrate: "192k"
  upscale_sharpen: "unsharp=5:5:0.4:5:5:0.0"
  downscale_sharpen: "unsharp=3:3:0.25:3:3:0.0"
  cover_max_mb: 4.8

# 微博查重与安全阈值设置
dedup:
  mode: "auto"
  enable_global_search: false
  lookback_days: 30
  min_date: ""
  daily_search_limit: 40
  min_delay_sec: 8.0
  max_delay_sec: 15.0
  max_queries_per_video: 2
  check_own_timelines: true
  cache_same_day: true
  headless: true
